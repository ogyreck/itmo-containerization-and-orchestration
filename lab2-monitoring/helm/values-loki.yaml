deploymentMode: SingleBinary

loki:
  auth_enabled: false           
                                 
  commonConfig:
    replication_factor: 1        

  storage:
    type: filesystem            

  schemaConfig:
    configs:
      - from: "2024-04-01"       
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: "168h"         
  compactor:
    retention_enabled: true      
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  nodeSelector: 
    purpose: monitoring               
  tolerations: 
    - key: "purpose"
      operator: "Equal"
      value: "monitoring"
      effect: "NoSchedule"                    
  resources: 
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "826Mi"
      cpu: "500m"                
  persistence:
    enabled: true
    storageClass: local-path
    size: "3G"

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0


chunksCache:
  enabled: false
resultsCache:
  enabled: false

minio:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

gateway:
  enabled: false                  
