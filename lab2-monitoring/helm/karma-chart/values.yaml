replicaCount: 1

image:
  repository: ghcr.io/prymitive/karma
  tag: "v0.133"
  pullPolicy: IfNotPresent

# Karma ничего не хранит: она опрашивает Alertmanager и показывает его алерты
alertmanager:
  name: "kps"
  uri: "http://kps-kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093"       
  timeout: "10s"
  interval: "30s"

service:
  type: NodePort
  port: 8080
  nodePort: 32004

nodeSelector: 
  purpose: monitoring               
tolerations: 
  - key: "purpose"
    operator: "Equal"
    value: "monitoring"
    effect: "NoSchedule"                    
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"
