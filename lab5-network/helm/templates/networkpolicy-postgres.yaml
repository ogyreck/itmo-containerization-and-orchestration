{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkPolicy.components.postgres.podSelector | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # 1. Входящие соединения к СУБД от наших shop-api и worker
  - from:
    - podSelector:
        matchLabels:
          {{- toYaml .Values.networkPolicy.components.api.podSelector | nindent 10 }}
    - podSelector:
        matchLabels:
          {{- toYaml .Values.networkPolicy.components.worker.podSelector | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.networkPolicy.components.postgres.port }}
  # 2. CNPG operator опрашивает статус инстанса
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.components.cnpgOperator.namespace }}
      podSelector:
        matchLabels:
          {{- toYaml .Values.networkPolicy.components.cnpgOperator.podSelector | nindent 10 }}
    ports:
    {{- range .Values.networkPolicy.components.postgres.operatorPorts }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
  {{- if gt (int .Values.postgres.instances) 1 }}
  # 3. Репликация между инстансами Postgres — только если их больше одного
  - from:
    - podSelector:
        matchLabels:
          {{- toYaml .Values.networkPolicy.components.postgres.podSelector | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.networkPolicy.components.postgres.port }}
  {{- end }}
  egress:
  {{- if gt (int .Values.postgres.instances) 1 }}
  # 1. Отправка WAL репликам
  - to:
    - podSelector:
        matchLabels:
          {{- toYaml .Values.networkPolicy.components.postgres.podSelector | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.networkPolicy.components.postgres.port }}
  {{- end }}
  # 2. Instance manager CNPG читает и обновляет свой Cluster в API-сервере
  - to:
    - ipBlock:
        cidr: {{ .Values.networkPolicy.infrastructure.apiServer.cidr | quote }}
    ports:
    - protocol: TCP
      port: {{ .Values.networkPolicy.infrastructure.apiServer.port }}
{{- end }}