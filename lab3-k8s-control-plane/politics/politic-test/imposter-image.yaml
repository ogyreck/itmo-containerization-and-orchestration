apiVersion: v1
kind: Pod
metadata:
  name: imposter-image
  namespace: lab3
  labels:
    app.kubernetes.io/name: kyverno-test
    lab: lab3
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: app
      image: docker.io/library/nginx:1.27
      securityContext:
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi