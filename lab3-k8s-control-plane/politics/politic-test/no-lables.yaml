apiVersion: v1
kind: Pod
metadata:
  name: no-labels
  namespace: lab3
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: app
      image: ghcr.io/ogyreck/shop-api:0.2.0
      securityContext:
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi