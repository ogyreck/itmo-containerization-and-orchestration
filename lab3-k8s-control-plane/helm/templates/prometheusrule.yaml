apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-rules
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: {{ .Release.Name }}
    lab: lab3
    release: kps
spec:
  groups:
    - name: shop.rules
      rules:
        - alert: ShopApiHighErrorRate
          expr: |
            sum(rate(api_requests_total{namespace="{{ .Release.Namespace }}", path!="/health", status=~"5.."}[5m]))
              /
            sum(rate(api_requests_total{namespace="{{ .Release.Namespace }}", path!="/health"}[5m]))
              > {{ .Values.alerts.errorRatio }}
          for: {{ .Values.alerts.errorRatioFor }}
          labels:
            severity: critical
          annotations:
            summary: "shop api: доля ошибок 5xx {{`{{ $value | humanizePercentage }}`}}"
            description: "Больше {{ .Values.alerts.errorRatio | mulf 100 }}% запросов к /order и /orders завершаются 5xx дольше {{ .Values.alerts.errorRatioFor }}. Частая причина — недоступен postgres (смотри api_db_errors_total)."

        # p95 
        - alert: ShopApiHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(api_request_duration_seconds_bucket{namespace="{{ .Release.Namespace }}", path!="/health"}[5m]))
            ) > {{ .Values.alerts.latencyP95Seconds }}
          for: {{ .Values.alerts.latencyFor }}
          labels:
            severity: warning
          annotations:
            summary: "shop api: p95 латентности {{`{{ $value | humanizeDuration }}`}}"
            description: "95-й перцентиль времени ответа /order и /orders выше {{ .Values.alerts.latencyP95Seconds }}s дольше {{ .Values.alerts.latencyFor }}."

        - alert: ShopWorkerStalled
          expr: |
            time() - max(worker_last_success_timestamp_seconds{namespace="{{ .Release.Namespace }}"}) > {{ .Values.alerts.workerStalledSeconds }}
              or
            absent(worker_last_success_timestamp_seconds{namespace="{{ .Release.Namespace }}"})
          for: {{ .Values.alerts.workerStalledFor }}
          labels:
            severity: critical
          annotations:
            summary: "shop worker не обрабатывает заказы"
            description: "Ни одна реплика worker не завершала успешный цикл больше {{ .Values.alerts.workerStalledSeconds }}s. Заказов в очереди: смотри shop_orders_pending."
