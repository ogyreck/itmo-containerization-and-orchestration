k3s_config_dir: "/etc/rancher/k3s"
k3s_config_file: "{{ k3s_config_dir }}/config.yaml"

k3s_version: "v1.36.4+k3s1"

k3s_token: "{{ stand_k3s_token }}"
k3s_tls_san: "k3s-cp.lan"

k3s_disable_components:
  - traefik
  - servicelb

#Запуск etcd
k3s_cluster_init: true

k3s_isolate_control_plane: true

k3s_local_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/k3s-lab.yaml"
